<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>레시피북 미리보기</title>
<style>
  html,body{margin:0;padding:0;background:#dfe5ee}
  body{display:flex;justify-content:center;align-items:flex-start;padding:10px}
  iframe{border:0;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.15);border-radius:12px}
</style>
</head>
<body>
<script>
  var p = new URLSearchParams(location.search);
  var w = Number(p.get('w') || 390);
  var h = Number(p.get('h') || 844);
  var src = p.get('src') || ('index.html?v=' + (p.get('v') || '1'));
  var f = document.createElement('iframe');
  f.width = w; f.height = h; f.src = src;
  f.setAttribute('title', 'recipe-book ' + w + 'x' + h);
  document.body.appendChild(f);
  document.title = '레시피북 ' + w + 'x' + h;
</script>
</body>
</html>
